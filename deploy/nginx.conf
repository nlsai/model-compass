server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://openrouter.ai; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /assets/app.js { try_files $uri =404; }
    location = /assets/styles.css { try_files $uri =404; }
    location / { return 404; }
}
